<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一脉青藤 - 检查预约</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #E8F5F0 0%, #D4EDE5 30%, #FFFFFF 100%);
            min-height: 100vh;
            padding-bottom: 70px;
        }

        /* Status Bar */
        .status-bar {
            height: 44px;
            background: transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            font-size: 12px;
            color: #000;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .signal-dot {
            width: 4px;
            height: 4px;
            background: #000;
            border-radius: 50%;
        }

        .status-center {
            font-weight: 500;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 15px 0;
            font-size: 17px;
            font-weight: 500;
            color: #000;
        }

        /* Banner */
        .banner {
            margin: 20px 15px;
            background: white;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .banner-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .banner-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: #4CAF50;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 500;
            color: #4CAF50;
        }

        .banner-slogan {
            font-size: 14px;
            color: #333;
            padding-left: 32px;
        }

        .banner-image {
            width: 120px;
            height: 80px;
            background: linear-gradient(135deg, #E8F5F0 0%, #C8E6DD 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        /* Main Content */
        .content {
            margin: 0 15px;
        }

        .user-name {
            font-size: 20px;
            font-weight: 600;
            color: #000;
            margin-bottom: 20px;
        }

        /* Info Card */
        .info-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .info-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 15px;
            color: #333;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #666;
        }

        .info-value {
            color: #000;
            font-weight: 500;
        }

        /* Exam Type Badge */
        .exam-badge {
            background: #E8F5F0;
            border: 1px solid #4CAF50;
            border-radius: 20px;
            padding: 8px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333;
        }

        .exam-icon {
            width: 20px;
            height: 20px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        /* Date Selector */
        .date-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-text {
            color: #000;
            font-weight: 500;
        }

        .date-label {
            color: #999;
            font-size: 13px;
        }

        .arrow {
            color: #999;
            font-size: 16px;
        }

        /* Query Button */
        .query-button {
            width: 100%;
            background: linear-gradient(135deg, #4CAF50 0%, #45A049 100%);
            border: none;
            border-radius: 25px;
            padding: 15px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Hospital Card */
        .hospital-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .hospital-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .hospital-name {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            color: #000;
        }

        .hospital-icon {
            width: 24px;
            height: 24px;
            color: #FF5252;
            font-size: 20px;
        }

        .complete-badge {
            background: #E3F2FD;
            color: #2196F3;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
        }

        .appointment-item {
            padding: 15px 0;
            border-bottom: 1px solid #F0F0F0;
        }

        .appointment-item:last-child {
            border-bottom: none;
        }

        .appointment-time {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .appointment-type {
            font-size: 14px;
            color: #333;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        .btn-outline {
            background: white;
            border: 1px solid #4CAF50;
            color: #4CAF50;
        }

        .btn-primary {
            background: #4CAF50;
            border: 1px solid #4CAF50;
            color: white;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #E0E0E0;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 20px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #999;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #4CAF50;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <div class="status-left">
            <div class="signal-dot"></div>
            <div class="signal-dot"></div>
            <div class="signal-dot"></div>
            <div class="signal-dot"></div>
            <div class="signal-dot"></div>
            <span style="margin-left: 5px;">WeChat</span>
        </div>
        <div class="status-center">1:21 AM</div>
        <div class="status-right">
            <span>100%</span>
            <span>🔋</span>
        </div>
    </div>

    <!-- Header -->
    <div class="header">一脉青藤</div>

    <!-- Banner -->
    <div class="banner">
        <div class="banner-left">
            <div class="banner-logo">
                <div class="logo-icon">一</div>
                <div class="logo-text">一脉青藤</div>
            </div>
            <div class="banner-slogan">检查无异，健康同心</div>
        </div>
        <div class="banner-image">👨‍⚕️</div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <div class="user-name">李XX</div>

        <div class="info-card">
            <div class="info-row">
                <span class="info-label">检查单号：</span>
                <span class="info-value">hdf_2025122660001</span>
            </div>

            <div class="info-row">
                <div class="exam-badge">
                    <div class="exam-icon">✓</div>

            </div>

            <div class="info-row">
                <span class="info-label">检查时间：</span>
                <div class="date-selector">
                    <span class="date-text">12月15日</span>
                    <span class="date-label">明天</span>
                    <span class="arrow">▶</span>
                </div>
            </div>

            <button class="query-button">查询</button>
        </div>

        <!-- Hospital Card -->
        <div class="hospital-card">
            <div class="hospital-header">
                <div class="hospital-name">
                    <span class="hospital-icon">🏥</span>
                    <span>XX第一人民医院</span>
                </div>
                <div class="complete-badge">待完成</div>
            </div>

            <div class="appointment-item">
                <div class="appointment-time">检查时间：2025-12-15 11:00-12:00</div>
                <div class="appointment-type">检查项目：1.5MR颅内动脉血管成像（MRA）</div>
            </div>

            <div class="appointment-item">
                <div class="appointment-time">检查时间：2025-12-15 13:00-14:00</div>
                <div class="appointment-type">检查项目：CT颅内动脉血管成像</div>
            </div>

            <div class="action-buttons">
                <button class="action-btn btn-outline">快捷导航</button>
                <button class="action-btn btn-outline">客服咨询</button>
                <button class="action-btn btn-primary">预约详情</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item">
            <div class="nav-icon">🤖</div>
            <div>青藤AI</div>
        </div>
        <div class="nav-item active">
            <div class="nav-icon">🔍</div>
            <div>检查</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👤</div>
            <div>我的</div>
        </div>
    </div>
</body>
</html>
