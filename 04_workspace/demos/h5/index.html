<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>患者开单</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            padding-bottom: 80px;
        }

        .header {
            background: #fff;
            padding: 12px 16px;
            text-align: center;
            border-bottom: 1px solid #e5e5e5;
        }

        .header h1 {
            font-size: 17px;
            font-weight: 500;
            color: #333;
        }

        .container {
            padding: 12px;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .field-label {
            font-size: 15px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .field-label.required::before {
            content: '*';
            color: #ff4d4f;
            margin-right: 4px;
        }

        .input-box {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: none;
            background: #f7f7f7;
            border-radius: 6px;
            font-size: 14px;
            color: #333;
            resize: vertical;
            font-family: inherit;
            margin-bottom: 16px;
        }

        .input-box::placeholder {
            color: #c0c0c0;
        }

        .time-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .time-btn {
            padding: 6px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
            font-size: 14px;
            color: #666;
            background: #fff;
            cursor: pointer;
            white-space: nowrap;
        }

        .time-btn.active {
            background: #fff;
            color: #52c41a;
            border-color: #52c41a;
        }

        .date-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            font-size: 15px;
            color: #666;
        }

        .date-display .right {
            color: #999;
            display: flex;
            align-items: center;
        }

        .date-display .right::after {
            content: '›';
            margin-left: 6px;
            font-size: 18px;
        }

        .action-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 12px;
            margin-bottom: 16px;
        }

        .action-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
        }

        .action-card.add {
            border: 1px dashed #52c41a;
            background: #fff;
        }

        .action-card.add .icon {
            font-size: 32px;
            color: #52c41a;
            margin-bottom: 8px;
        }

        .action-card.add .text {
            font-size: 14px;
            color: #52c41a;
        }

        .action-card.ai {
            background: linear-gradient(135deg, #36cfc9 0%, #13c2c2 100%);
            border: none;
        }

        .action-card.ai .icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            font-size: 20px;
        }

        .action-card.ai .text {
            font-size: 14px;
            color: #fff;
        }

        .action-card.expert {
            background: #f5f5f5;
            border: none;
            position: relative;
        }

        .action-card.expert .icon {
            font-size: 32px;
            color: #d9d9d9;
            margin-bottom: 8px;
        }

        .action-card.expert .text {
            font-size: 14px;
            color: #999;
        }

        .action-card.expert .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #f0f0f0;
            color: #999;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .project-list {
            margin-top: 16px;
        }

        .project-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .project-item:last-child {
            border-bottom: none;
        }

        .project-icon {
            width: 32px;
            height: 32px;
            background: #52c41a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .project-icon::before {
            content: '✓';
            color: #fff;
            font-size: 16px;
        }

        .project-info {
            flex: 1;
        }

        .project-name {
            font-size: 15px;
            color: #333;
        }

        .project-delete {
            width: 24px;
            height: 24px;
            background: #ff4d4f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .project-delete::before {
            content: '−';
            color: #fff;
            font-size: 18px;
            font-weight: 300;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 14px;
        }

        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 12px 16px;
            box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #52c41a;
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 400;
            cursor: pointer;
        }

        .submit-btn:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>患者开单</h1>
    </div>

    <div class="container">
        <div class="card">
            <div class="field-label">症状描述:</div>
            <textarea class="input-box" placeholder="请输入患者症状"></textarea>

            <div class="field-label">诊断描述:</div>
            <textarea class="input-box" placeholder="请输入诊断建议"></textarea>

            <div class="field-label required">预约时间:</div>
            <div class="time-selector">
                <div class="time-btn active">明天</div>
                <div class="time-btn">后天</div>
                <div class="time-btn">本周六</div>
                <div class="time-btn">本周日</div>
            </div>
            <div class="date-display">
                <span>2026年2月7号</span>
                <span class="right">今天</span>
            </div>

            <div class="field-label required">检查项目:</div>
            <div class="action-cards">
                <div class="action-card add" onclick="showAddProject()">
                    <div class="icon">+</div>
                    <div class="text">添加项目</div>
                </div>
                <div class="action-card ai" onclick="alert('AI项目推荐')">
                    <div class="icon">AI</div>
                    <div class="text">AI项目推荐</div>
                </div>
                <div class="action-card expert">
                    <div class="badge">已规划</div>
                    <div class="icon">♥</div>
                    <div class="text">专家咨询</div>
                </div>
            </div>

            <div class="project-list" id="projectList">
                <div class="project-item">
                    <div class="project-icon"></div>
                    <div class="project-info">
                        <div class="project-name">CT颅脑平扫</div>
                    </div>
                    <div class="project-delete" onclick="deleteProject(0)"></div>
                </div>
                <div class="project-item">
                    <div class="project-icon"></div>
                    <div class="project-info">
                        <div class="project-name">CT颅脑平扫</div>
                    </div>
                    <div class="project-delete" onclick="deleteProject(1)"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="submit-btn" onclick="submitOrder()">
            查询机构
        </button>
    </div>

    <script>
        const projects = [
            { id: 0, name: 'CT颅脑平扫' },
            { id: 1, name: 'CT颅脑平扫' }
        ];

        function showAddProject() {
            const mockProjects = [
                'DR胸部正位',
                'MR膝关节',
                'CT腹部增强',
                'DR腰椎正侧位'
            ];
            const randomName = mockProjects[Math.floor(Math.random() * mockProjects.length)];
            const newId = projects.length;
            projects.push({ id: newId, name: randomName });
            renderProjects();
        }

        function deleteProject(id) {
            const index = projects.findIndex(p => p.id === id);
            if (index > -1) {
                projects.splice(index, 1);
                renderProjects();
            }
        }

        function renderProjects() {
            const listEl = document.getElementById('projectList');
            
            if (projects.length === 0) {
                listEl.innerHTML = '<div class="empty-state">暂无检查项目</div>';
            } else {
                listEl.innerHTML = projects.map(p => `
                    <div class="project-item">
                        <div class="project-icon"></div>
                        <div class="project-info">
                            <div class="project-name">${p.name}</div>
                        </div>
                        <div class="project-delete" onclick="deleteProject(${p.id})"></div>
                    </div>
                `).join('');
            }
        }

        function submitOrder() {
            alert('查询机构');
        }

        document.querySelectorAll('.time-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
