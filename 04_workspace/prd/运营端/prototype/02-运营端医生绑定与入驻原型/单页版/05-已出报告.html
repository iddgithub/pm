<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>已出报告</title>
    <style>
      :root {
        --accent: #16aa68;
        --accent-deep: #0d9157;
        --teal: #24bfa7;
        --text: #414750;
        --text-strong: #343941;
        --muted: #7f8790;
        --surface: #ffffff;
        --line: #e7edf2;
        --page: #f5f8fd;
        --shadow: 0 14px 32px rgba(103, 134, 153, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        padding: 24px 14px;
        background: #edf2f6;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      button {
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .prototype-shell {
        width: min(100%, 375px);
        position: relative;
      }

      .phone-canvas {
        position: relative;
        overflow: hidden;
        height: 812px;
        border-radius: 34px;
        background: linear-gradient(180deg, #fcfeff 0%, #f3f6fb 100%);
        box-shadow: 0 24px 52px rgba(53, 79, 96, 0.16);
        display: flex;
        flex-direction: column;
      }

      .phone-canvas::before {
        content: "";
        position: absolute;
        inset: 86px 0 auto;
        height: 248px;
        background:
          radial-gradient(circle at 81% 9%, rgba(167, 255, 214, 0.64), transparent 25%),
          radial-gradient(circle at 10% 42%, rgba(255, 255, 255, 0.78), transparent 23%),
          linear-gradient(180deg, #c7efff 0%, #edf8fb 54%, #f4f7fc 100%);
        z-index: 0;
      }

      .phone-canvas::after {
        content: "";
        position: absolute;
        left: -62px;
        top: 138px;
        width: 236px;
        height: 236px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.36);
        box-shadow:
          42px 28px 0 0 rgba(255, 255, 255, 0.12),
          84px 58px 0 0 rgba(255, 255, 255, 0.08);
        opacity: 0.82;
        z-index: 0;
        pointer-events: none;
      }

      .status-bar,
      .header,
      .main-content,
      .share-guide {
        position: relative;
        z-index: 1;
      }

      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 6px;
        color: #22272f;
        font-size: 13px;
      }

      .status-side {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 88px;
      }

      .status-side--right {
        justify-content: flex-end;
      }

      .signal-dots {
        font-size: 12px;
        letter-spacing: 1px;
      }

      .status-label {
        font-size: 12px;
      }

      .status-time {
        font-size: 14px;
        font-weight: 600;
      }

      .battery {
        position: relative;
        width: 23px;
        height: 11px;
        border: 1.4px solid #2f3439;
        border-radius: 2px;
      }

      .battery::after {
        content: "";
        position: absolute;
        top: 3px;
        right: -3px;
        width: 2px;
        height: 4px;
        border-radius: 0 1px 1px 0;
        background: #2f3439;
      }

      .battery i {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 17px;
        height: 7px;
        border-radius: 1px;
        background: #2f3439;
      }

      .header {
        display: grid;
        grid-template-columns: 40px 1fr 40px;
        align-items: center;
        padding: 8px 14px 10px;
      }

      .header h1 {
        margin: 0;
        text-align: center;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #2e3338;
      }

      .nav-back {
        position: relative;
        width: 30px;
        height: 30px;
      }

      .nav-back::before {
        content: "";
        position: absolute;
        top: 9px;
        left: 10px;
        width: 11px;
        height: 11px;
        border-left: 2px solid #2f3439;
        border-bottom: 2px solid #2f3439;
        transform: rotate(45deg);
      }

      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px 22px;
        scrollbar-width: none;
      }

      .main-content::-webkit-scrollbar {
        display: none;
      }

      .panel,
      .report-card,
      .result-card {
        border-radius: 13px;
        background: #ffffff;
        box-shadow: var(--shadow);
      }

      .panel {
        padding: 15px 10px 11px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .action-btn {
        display: grid;
        justify-items: center;
        gap: 8px;
        font-size: 14px;
        color: var(--text-strong);
      }

      .action-btn span {
        line-height: 1.2;
      }

      .action-icon {
        position: relative;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        filter: drop-shadow(0 6px 10px rgba(46, 179, 142, 0.18));
      }

      .action-icon svg {
        width: 100%;
        height: 100%;
      }

      .report-card {
        margin-top: 16px;
        overflow: hidden;
      }

      .report-top {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 14px 16px;
        background: linear-gradient(100deg, rgba(228, 251, 255, 0.98) 0%, rgba(236, 255, 247, 0.98) 100%);
      }

      .report-name {
        margin: 0;
        font-size: 16px;
        font-weight: 500;
        color: var(--text-strong);
      }

      .report-name span {
        color: #868d95;
        font-weight: 400;
      }

      .report-top-meta {
        display: grid;
        gap: 10px;
        margin-top: 12px;
        font-size: 14px;
        color: #737b85;
      }

      .report-top-meta p,
      .report-bottom p {
        margin: 0;
        line-height: 1.35;
      }

      .report-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .report-top-meta strong,
      .report-bottom strong {
        display: inline-block;
        min-width: 72px;
        color: #6b737d;
        font-weight: 500;
        flex: none;
      }

      .modality-tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 41px;
        height: 28px;
        padding: 0 11px;
        border-radius: 14px;
        background: linear-gradient(180deg, #24ba77 0%, #14995e 100%);
        color: #ffffff;
        font-size: 14px;
        line-height: 1;
      }

      .report-bottom {
        padding: 16px 14px 18px;
        display: grid;
        gap: 12px;
        font-size: 14px;
        color: #737b85;
      }

      .result-card {
        position: relative;
        overflow: hidden;
        margin-top: 18px;
        padding: 16px 18px 18px;
        border: 1px solid rgba(182, 234, 214, 0.96);
        background: linear-gradient(180deg, rgba(241, 254, 248, 0.96) 0%, rgba(255, 255, 255, 0.98) 100%);
        box-shadow: 0 10px 22px rgba(112, 174, 155, 0.08);
      }

      .result-card::after {
        content: "";
        position: absolute;
        right: 8px;
        top: 6px;
        width: 86px;
        height: 86px;
        opacity: 0.65;
        background:
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M36 28c0-10 8-18 18-18s18 8 18 18v15" stroke="%23d8fff2" stroke-width="5"/><path d="M42 78c-12-9-18-23-18-37 0-10 5-15 12-15 10 0 13 8 13 15v25c0 10-7 18-16 18-4 0-8-2-11-6" stroke="%23d6f0ff" stroke-width="5"/><path d="M78 76c12-9 18-23 18-37 0-10-5-15-12-15-10 0-13 8-13 15v27c0 11 8 18 17 18 4 0 8-2 11-6" stroke="%23dffde9" stroke-width="5"/><path d="M83 83l20-20" stroke="%239ee8c7" stroke-width="7"/><circle cx="105" cy="61" r="7" fill="%23f4d3ea"/><circle cx="93" cy="28" r="6" fill="%23d6fff1"/><circle cx="28" cy="33" r="5" fill="%23edf4ff"/></g></svg>')
            no-repeat center / contain;
        pointer-events: none;
      }

      .result-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
        color: var(--text-strong);
        font-size: 15px;
        font-weight: 600;
      }

      .result-title::before {
        content: "";
        width: 5px;
        height: 12px;
        border-radius: 3px;
        background: var(--accent);
        box-shadow: 0 0 0 2px rgba(22, 170, 104, 0.08);
      }

      .result-text {
        position: relative;
        z-index: 1;
        margin: 0;
        color: #5a616a;
        font-size: 14px;
        line-height: 1.72;
      }

      .share-guide {
        position: absolute;
        inset: 0;
        border-radius: 34px;
        background: rgba(24, 25, 28, 0.72);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.24s ease;
      }

      .share-guide.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .guide-path {
        position: absolute;
        top: 86px;
        right: 18px;
        width: 124px;
        height: 138px;
      }

      .guide-path svg {
        width: 100%;
        height: 100%;
      }

      .guide-focus {
        position: absolute;
        top: 130px;
        right: 98px;
        width: 98px;
        height: 98px;
      }

      .focus-ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 62px;
        height: 62px;
        border: 4px solid rgba(255, 255, 255, 0.95);
        border-radius: 50%;
      }

      .focus-ring::before {
        content: "";
        position: absolute;
        top: 24px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffffff;
        left: 13px;
        box-shadow: 16px 0 0 #ffffff, 32px 0 0 #ffffff;
      }

      .focus-hand {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 58px;
        height: 58px;
      }

      .guide-text {
        position: absolute;
        left: 50%;
        top: 364px;
        transform: translateX(-50%);
        margin: 0;
        color: #ffffff;
        font-size: 20px;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      .guide-close {
        position: absolute;
        left: 50%;
        top: 446px;
        transform: translateX(-50%);
        min-width: 144px;
        height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.92);
        border-radius: 20px;
        color: #ffffff;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(1px);
      }

      .screen-reader {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 480px) {
        body {
          padding: 0;
          background: #ffffff;
        }

        .prototype-shell {
          width: 100%;
        }

        .phone-canvas {
          height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }

        .share-guide {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="prototype-shell" aria-label="已出报告高保真原型">
      <section class="phone-canvas">
        <div class="status-bar">
          <div class="status-side">
            <span class="signal-dots">●●●●●</span>
            <span class="status-label">WeChat</span>
          </div>
          <span class="status-time">1:21 AM</span>
          <div class="status-side status-side--right">
            <span class="status-label">100%</span>
            <span class="battery" aria-hidden="true"><i></i></span>
          </div>
        </div>

        <header class="header">
          <button class="nav-back" type="button" aria-label="返回上一页" onclick="goBack()"></button>
          <h1>已出报告</h1>
          <span aria-hidden="true"></span>
        </header>

        <div class="main-content">
          <section class="panel" aria-label="报告相关操作">
            <button class="action-btn" type="button" aria-label="查看影像">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="lungBg" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#97f1d5" />
                      <stop offset="1" stop-color="#19b58f" />
                    </linearGradient>
                  </defs>
                  <rect x="5" y="5" width="38" height="38" rx="11" fill="url(#lungBg)" />
                  <path d="M24 13v8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
                  <path d="M21 20c-1-4-4-6-7-6-3 0-5 2-5 6 0 7 3 11 8 12 2 .4 4-1 4-3V20Z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" />
                  <path d="M27 20c1-4 4-6 7-6 3 0 5 2 5 6 0 7-3 11-8 12-2 .4-4-1-4-3V20Z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" />
                </svg>
              </span>
              <span>查看影像</span>
            </button>

            <button class="action-btn" type="button" aria-label="查看报告">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="pdfBg" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#8fe7d1" />
                      <stop offset="1" stop-color="#08a57a" />
                    </linearGradient>
                  </defs>
                  <rect x="7" y="5" width="28" height="38" rx="4" fill="url(#pdfBg)" />
                  <polygon points="35,5 41,11 35,11" fill="#dffff7" />
                  <path d="M35 5v6h6" fill="none" stroke="#dffff7" stroke-width="2" />
                  <path d="M12 18h17M12 23h17" stroke="#d9fff6" stroke-width="2.2" stroke-linecap="round" />
                  <text x="14" y="34" fill="#ffffff" font-size="10" font-family="Arial, sans-serif" font-weight="700">PDF</text>
                </svg>
              </span>
              <span>查看报告</span>
            </button>

            <button class="action-btn" type="button" aria-label="分享报告" onclick="openShareGuide()">
              <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <linearGradient id="shareBg" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0" stop-color="#8cebc3" />
                      <stop offset="1" stop-color="#00b270" />
                    </linearGradient>
                  </defs>
                  <rect x="8" y="9" width="32" height="24" rx="5" fill="url(#shareBg)" />
                  <path d="M16 25 31 18l-6 10-2-4-7 1Z" fill="#ffffff" />
                  <path d="M31 18 23 24" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>
              <span>分享</span>
            </button>
          </section>

          <article class="report-card">
            <section class="report-top">
              <div>
                <p class="report-name">刘大福 <span>女｜63岁</span></p>
                <div class="report-top-meta">
                  <p class="report-row"><strong>检查单号</strong><span>CT20250923</span></p>
                  <p class="report-row"><strong>检查日期</strong><span>2025-09-23 10:20:45</span></p>
                </div>
              </div>
              <span class="modality-tag">MR</span>
            </section>

            <section class="report-bottom">
              <p class="report-row"><strong>检查项目：</strong><span>颅脑平扫+增强</span></p>
              <p class="report-row"><strong>检查机构：</strong><span>北京一脉阳光医学影像诊断中心</span></p>
              <p class="report-row"><strong>报告医生：</strong><span>张医生</span></p>
              <p class="report-row"><strong>审核医生：</strong><span>刘医生</span></p>
              <p class="report-row"><strong>报告日期：</strong><span>2025-09-23 12:23:34</span></p>
            </section>
          </article>

          <article class="result-card">
            <h2 class="result-title">影像学表现</h2>
            <p class="result-text">
              双肺野清晰，未见明显结节及斑片状密度增高影；纵隔居中，心影大小形态正常；双侧胸腔未见积液征象。
            </p>
          </article>

          <article class="result-card">
            <h2 class="result-title">影像学诊断</h2>
            <p class="result-text">
              胸部CT平扫未见明显异常，请结合临床症状及其他检查综合判断，必要时复查。
            </p>
          </article>

          <span class="screen-reader">点击分享按钮可打开分享引导层。</span>
        </div>

        <div class="share-guide" id="shareGuide" onclick="closeShareGuide()">
          <div class="guide-path" aria-hidden="true">
            <svg viewBox="0 0 124 138" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M16 78c14-19 35-23 51-16 18 8 25 28 16 46M73 94c15 7 33 3 44-9 14-14 18-35 15-58"
                fill="none"
                stroke="#fff"
                stroke-width="4"
                stroke-linecap="round"
                stroke-dasharray="8 8"
              />
              <path d="m117 8 6 17-16-5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>

          <div class="guide-focus" aria-hidden="true">
            <div class="focus-ring"></div>
            <svg class="focus-hand" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M26 34V15a4 4 0 0 1 8 0v13h2V11a4 4 0 0 1 8 0v17h2V15a4 4 0 0 1 8 0v18c0 6-2 11-6 15l-6 6c-3 3-8 3-11 0l-9-9a4 4 0 0 1 5-6l5 4V34a4 4 0 0 1 8 0v6h2v-4a4 4 0 0 1 8 0"
                fill="none"
                stroke="#fff"
                stroke-width="3.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <p class="guide-text">点击右上角分享</p>
          <button class="guide-close" type="button" onclick="closeShareGuide(event)">我知道了</button>
        </div>
      </section>
    </main>

    <script>
      const shareGuide = document.getElementById("shareGuide");

      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = "04-订单详情.html";
      }

      function openShareGuide() {
        shareGuide.classList.add("is-visible");
      }

      function closeShareGuide(event) {
        if (event) {
          event.stopPropagation();
        }
        shareGuide.classList.remove("is-visible");
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeShareGuide();
        }
      });
    </script>
  </body>
</html>
