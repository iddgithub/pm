<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>订单详情</title>
    <style>
      :root {
        --accent: #16aa68;
        --accent-deep: #0d9157;
        --text: #40454d;
        --text-strong: #343940;
        --muted: #7f8791;
        --surface: #ffffff;
        --line: #e7edf2;
        --page: #f5f8fd;
        --shadow: 0 14px 32px rgba(103, 134, 153, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        padding: 24px 14px;
        background: #edf2f6;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      a,
      button {
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      button {
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
        cursor: pointer;
      }

      .prototype-shell {
        width: min(100%, 375px);
      }

      .phone-canvas {
        position: relative;
        overflow: hidden;
        height: 812px;
        border-radius: 34px;
        background: linear-gradient(180deg, #fcfeff 0%, #f3f6fb 100%);
        box-shadow: 0 24px 52px rgba(53, 79, 96, 0.16);
        display: flex;
        flex-direction: column;
      }

      .phone-canvas::before {
        content: "";
        position: absolute;
        inset: 86px 0 auto;
        height: 244px;
        background:
          radial-gradient(circle at 82% 8%, rgba(163, 255, 205, 0.68), transparent 25%),
          radial-gradient(circle at 12% 40%, rgba(255, 255, 255, 0.78), transparent 22%),
          linear-gradient(180deg, #c8f0ff 0%, #edf8fb 54%, #f4f7fc 100%);
        z-index: 0;
      }

      .phone-canvas::after {
        content: "";
        position: absolute;
        left: -62px;
        top: 136px;
        width: 236px;
        height: 236px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.36);
        box-shadow:
          42px 28px 0 0 rgba(255, 255, 255, 0.12),
          84px 58px 0 0 rgba(255, 255, 255, 0.08);
        opacity: 0.82;
        z-index: 0;
        pointer-events: none;
      }

      .status-bar,
      .header,
      .main-content {
        position: relative;
        z-index: 1;
      }

      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 6px;
        color: #22272f;
        font-size: 13px;
      }

      .status-side {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 88px;
      }

      .status-side--right {
        justify-content: flex-end;
      }

      .signal-dots {
        font-size: 12px;
        letter-spacing: 1px;
      }

      .status-label {
        font-size: 12px;
      }

      .status-time {
        font-size: 14px;
        font-weight: 600;
      }

      .battery {
        position: relative;
        width: 23px;
        height: 11px;
        border: 1.4px solid #2f3439;
        border-radius: 2px;
      }

      .battery::after {
        content: "";
        position: absolute;
        top: 3px;
        right: -3px;
        width: 2px;
        height: 4px;
        border-radius: 0 1px 1px 0;
        background: #2f3439;
      }

      .battery i {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 17px;
        height: 7px;
        border-radius: 1px;
        background: #2f3439;
      }

      .header {
        display: grid;
        grid-template-columns: 40px 1fr 40px;
        align-items: center;
        padding: 8px 14px 10px;
      }

      .header h1 {
        margin: 0;
        text-align: center;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #2e3338;
      }

      .nav-back {
        position: relative;
        width: 30px;
        height: 30px;
      }

      .nav-back::before {
        content: "";
        position: absolute;
        top: 9px;
        left: 10px;
        width: 11px;
        height: 11px;
        border-left: 2px solid #2f3439;
        border-bottom: 2px solid #2f3439;
        transform: rotate(45deg);
      }

      .main-content {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px 22px;
        scrollbar-width: none;
      }

      .main-content::-webkit-scrollbar {
        display: none;
      }

      .info-card,
      .check-card {
        border-radius: 13px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .info-card {
        overflow: hidden;
      }

      .info-top {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 25px 16px 18px;
        background: linear-gradient(100deg, rgba(228, 251, 255, 0.98) 0%, rgba(237, 255, 247, 0.98) 100%);
      }

      .info-top::after {
        content: "";
        position: absolute;
        right: -28px;
        top: -24px;
        width: 136px;
        height: 136px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(171, 255, 214, 0.3) 0%, rgba(171, 255, 214, 0) 68%);
      }

      .hospital-logo {
        position: relative;
        z-index: 1;
        width: 60px;
        height: 60px;
        flex: none;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 8px 18px rgba(110, 153, 164, 0.1);
        display: grid;
        place-items: center;
      }

      .hospital-logo svg {
        width: 44px;
        height: 44px;
      }

      .hospital-name {
        position: relative;
        z-index: 1;
        margin: 0;
        color: var(--text-strong);
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
      }

      .hospital-tags {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }

      .tag-level,
      .tag-type {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 26px;
        padding: 0 10px;
        border-radius: 5px;
        font-size: 12px;
        line-height: 1;
      }

      .tag-level {
        background: linear-gradient(180deg, #18bc72 0%, #0ea65f 100%);
        color: #ffffff;
        box-shadow: 0 6px 12px rgba(19, 175, 102, 0.18);
      }

      .tag-type {
        background: rgba(239, 250, 244, 0.96);
        color: #8ab898;
      }

      .info-bottom {
        padding: 16px 16px 17px;
      }

      .patient-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }

      .patient-name {
        font-size: 16px;
        font-weight: 500;
        color: var(--text-strong);
        white-space: nowrap;
      }

      .patient-name span {
        color: #868d95;
      }

      .phone-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        padding: 5px 11px 5px 8px;
        border-radius: 16px;
        background: #eef6f1;
        color: #74808a;
        font-size: 14px;
        line-height: 1;
        white-space: nowrap;
      }

      .phone-chip svg {
        width: 16px;
        height: 16px;
        flex: none;
      }

      .detail-list {
        display: grid;
        gap: 12px;
        font-size: 14px;
        color: #737b85;
      }

      .detail-list p {
        margin: 0;
        line-height: 1.35;
      }

      .detail-list strong {
        color: #6b737d;
        font-weight: 500;
      }

      .check-card {
        position: relative;
        display: block;
        margin-top: 18px;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .check-card:active {
        transform: scale(0.992);
      }

      .status-corner {
        position: absolute;
        top: 0;
        right: 0;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 11px 0 10px;
        border-bottom-left-radius: 14px;
        background: #a5b0bf;
        color: #ffffff;
        font-size: 12px;
        font-weight: 500;
        z-index: 2;
      }

      .status-corner::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
      }

      .check-main {
        padding: 18px 18px 17px;
      }

      .check-time {
        margin: 0;
        color: var(--text-strong);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.45;
        letter-spacing: 0.01em;
      }

      .check-divider {
        height: 1px;
        background: var(--line);
      }

      .check-meta {
        padding: 16px 18px 18px;
        display: grid;
        gap: 14px;
        font-size: 14px;
        color: #737b85;
      }

      .check-meta p {
        margin: 0;
        line-height: 1.35;
      }

      .check-meta strong {
        color: #6b737d;
        font-weight: 500;
      }

      .screen-reader {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (hover: hover) {
        .check-card:hover {
          transform: translateY(-1px);
          box-shadow: 0 18px 32px rgba(103, 134, 153, 0.16);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 0;
          background: #ffffff;
        }

        .prototype-shell {
          width: 100%;
        }

        .phone-canvas {
          height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="prototype-shell" aria-label="订单详情高保真原型">
      <section class="phone-canvas">
        <div class="status-bar">
          <div class="status-side">
            <span class="signal-dots">●●●●●</span>
            <span class="status-label">WeChat</span>
          </div>
          <span class="status-time">1:21 AM</span>
          <div class="status-side status-side--right">
            <span class="status-label">100%</span>
            <span class="battery" aria-hidden="true"><i></i></span>

        <header class="header">

        <div class="main-content">
          <article class="info-card">

                    d="M28 15h8v10h10v8H36v10h-8V33H18v-8h10z"

              </div>
            </section>

            <section class="info-bottom">
              <div class="patient-row">
                <div class="patient-name">刘大福 <span>| 58岁</span></div>
                <div class="phone-chip" aria-label="手机号 132 星号 星号 星号 星号 6688">
                  <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="10" cy="10" r="10" fill="#2eb477" />
                    <path
                      d="M13.58 11.82c-.44-.18-1.08-.47-1.52-.65-.2-.08-.43-.02-.58.13l-.68.68c-1.15-.62-2.07-1.54-2.7-2.69l.68-.69c.15-.15.2-.38.12-.58-.18-.44-.46-1.08-.64-1.51-.12-.3-.42-.49-.74-.49H6.4c-.42 0-.76.34-.74.76.18 3.75 3.19 6.76 6.94 6.94.42.02.76-.32.76-.74v-1.12c0-.32-.19-.61-.48-.74Z"
                      fill="#fff"
                    />
                  </svg>
                  <span>132****6688</span>
                </div>
              </div>

              <div class="detail-list">
                <p><strong>订单编号：</strong>QT8888888888888888</p>
                <p><strong>创建时间：</strong>2026-06-18 12:12:12</p>
                <p><strong>订单金额：</strong>¥180</p>
                <p><strong>关联医生：</strong>张医生</p>
              </div>
            </section>
          </article>

          <a class="check-card" href="05-已出报告.html" aria-label="查看第一个检查预约的报告详情">
            <span class="status-corner">待检查</span>
            <section class="check-main">
              <p class="check-time">预约时间：2025-12-15 11:00-12:00</p>
            </section>
            <div class="check-divider"></div>
            <section class="check-meta">
              <p><strong>检查项目：</strong>*CT颅脑(增强)</p>
              <p><strong>项目金额：</strong>¥90</p>
            </section>

          <a class="check-card" href="05-已出报告.html" aria-label="查看第二个检查预约的报告详情">
            <span class="status-corner">待检查</span>
            <section class="check-main">
              <p class="check-time">预约时间：2025-12-15 11:00-12:00</p>
            </section>
            <div class="check-divider"></div>
            <section class="check-meta">
              <p><strong>检查项目：</strong>*CT颅脑(增强)</p>
              <p><strong>项目金额：</strong>¥90</p>
            </section>
          </a>

          <span class="screen-reader">点击检查卡进入已出报告页。</span>
        </div>
      </section>
    </main>

    <script>
      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = "02-运营人员管理页.html";
      }
    </script>
  </body>
</html>
