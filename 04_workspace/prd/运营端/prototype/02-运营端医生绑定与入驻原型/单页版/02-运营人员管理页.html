<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>运营人员管理页</title>
    <style>
      :root {
        --accent: #18ac67;
        --accent-deep: #11995c;
        --accent-soft: #eefaf4;
        --accent-soft-strong: #e4f8ef;
        --ink: #3f454e;
        --muted: #8b95a2;
        --line: #e8edf3;
        --shadow: 0 16px 32px rgba(49, 96, 105, 0.1);
        --bg: #f6f8fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        padding: 24px 14px;
        background:
          radial-gradient(circle at 78% 2%, rgba(145, 255, 195, 0.54), rgba(145, 255, 195, 0) 14rem),
          linear-gradient(180deg, #eef4f7 0%, var(--bg) 100%);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .prototype-shell {
        width: min(100%, 390px);
      }

      .phone-canvas {
        position: relative;
        overflow: hidden;
        height: 844px;
        border-radius: 34px;
        background: #ffffff;
        box-shadow: 0 24px 54px rgba(46, 90, 98, 0.16);
      }

      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px 6px;
        color: #22272f;
        font-size: 13px;
        background: #ffffff;
      }

      .status-side {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 88px;
      }

      .status-side--right {
        justify-content: flex-end;
      }

      .signal-dots {
        font-size: 12px;
        letter-spacing: 1px;
      }

      .status-label {
        font-size: 12px;
      }

      .status-time {
        font-size: 14px;
        font-weight: 600;
      }

      .battery {
        position: relative;
        width: 23px;
        height: 11px;
        border: 1.4px solid #2f3439;
        border-radius: 2px;
      }

      .battery::after {
        position: absolute;
        top: 3px;
        right: -3px;
        width: 2px;
        height: 4px;
        border-radius: 0 1px 1px 0;
        background: #2f3439;
        content: "";
      }

      .battery i {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 17px;
        height: 7px;
        border-radius: 1px;
        background: #2f3439;
      }

      .page-stack {
        position: relative;
        height: calc(100% - 31px);
        background: #ffffff;
      }

      .page {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        opacity: 0;
        pointer-events: none;
        transform: translateX(18px);
        transition: transform 0.28s ease, opacity 0.28s ease;
      }

      .page.is-active {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(0);
      }

      .brand-header,
      .primary-tabs,
      .secondary-header {
        background: #ffffff;
      }

      .brand-header,
      .secondary-header {
        display: grid;
        grid-template-columns: 40px 1fr 40px;
        align-items: center;
        padding: 8px 14px 10px;
      }

      .brand-header h1,
      .secondary-header h1 {
        margin: 0;
        text-align: center;
        font-size: 17px;
        font-weight: 700;
        color: #2f3339;
      }

      .secondary-header {
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(236, 241, 246, 0.96);
      }

      .close-button,
      .sheet-close {
        position: relative;
        width: 30px;
        height: 30px;
      }

      .close-button::before,
      .close-button::after,
      .sheet-close::before,
      .sheet-close::after {
        position: absolute;
        top: 14px;
        left: 4px;
        width: 22px;
        height: 2px;
        border-radius: 999px;
        background: currentColor;
        content: "";
      }

      .close-button::before,
      .sheet-close::before {
        transform: rotate(45deg);
      }

      .close-button::after,
      .sheet-close::after {
        transform: rotate(-45deg);
      }

      .nav-back {
        position: relative;
        width: 30px;
        height: 30px;
      }

      .nav-back::before {
        position: absolute;
        top: 9px;
        left: 10px;
        width: 11px;
        height: 11px;
        border-left: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg);
        content: "";
      }

      .primary-tabs {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        padding: 0 14px;
        border-bottom: 1px solid rgba(220, 236, 238, 0.96);
      }

      .primary-tabs button {
        position: relative;
        height: 48px;
        color: #4d535d;
        font-size: 16px;
      }

      .primary-tabs .is-active {
        color: var(--accent);
        font-weight: 700;
      }

      .primary-tabs .is-active::after {
        position: absolute;
        right: 28px;
        bottom: 0;
        left: 28px;
        height: 3px;
        border-radius: 999px;
        background: var(--accent);
        content: "";
      }

      .main-screen,
      .doctor-screen {
        position: relative;
        flex: 1;
        overflow: auto;
        scrollbar-width: none;
      }

      .main-screen::-webkit-scrollbar,
      .doctor-screen::-webkit-scrollbar {
        display: none;
      }

      .main-screen {
        padding: 14px 14px 20px;
        background:
          radial-gradient(circle at 78% 2%, rgba(145, 255, 195, 0.86), rgba(145, 255, 195, 0) 7.5rem),
          linear-gradient(180deg, #dff4fb 0%, #eef4f9 28%, #f6f8fb 100%);
      }

      .main-screen::before,
      .main-screen::after {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.55);
        pointer-events: none;
        content: "";
      }

      .main-screen::before {
        top: 92px;
        left: -138px;
        width: 292px;
        height: 292px;
      }

      .main-screen::after {
        top: 146px;
        left: -72px;
        width: 228px;
        height: 228px;
        opacity: 0.78;
      }

      .screen-pattern {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 10% 26%, rgba(255, 255, 255, 0.5) 0 1px, transparent 1px) 0 0 / 90px 90px,
          radial-gradient(circle at 92% 6%, rgba(255, 255, 255, 0.22) 0 92px, transparent 92px);
        opacity: 0.8;
        pointer-events: none;
      }

      .doctor-screen {
        padding: 14px 14px 22px;
        background: linear-gradient(180deg, #ffffff 0%, #f5f8fc 100%);
      }

      .management-card,
      .filter-card,
      .search-row,
      .status-filters,
      .order-list,
      .doctor-list,
      .doctor-section-head {
        position: relative;
        z-index: 1;
      }

      .management-card {
        display: grid;
        grid-template-columns: 1fr 144px;
        gap: 12px;
        align-items: center;
        padding: 20px 14px 18px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.78);
        box-shadow: 0 14px 26px rgba(73, 119, 126, 0.08);
        backdrop-filter: blur(14px);
      }

      .operator-profile {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .operator-avatar {
        position: relative;
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(180deg, #e8fbf2 0%, #b9efd8 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }

      .avatar-figure {
        position: relative;
        width: 34px;
        height: 34px;
      }

      .avatar-hair {
        position: absolute;
        top: 3px;
        left: 8px;
        width: 18px;
        height: 10px;
        border-radius: 10px 10px 7px 7px;
        background: #163e5b;
      }

      .avatar-face {
        position: absolute;
        top: 8px;
        left: 10px;
        width: 14px;
        height: 16px;
        border-radius: 7px 7px 8px 8px;
        background: #ffd8bd;
      }

      .avatar-glasses,
      .avatar-glasses::before,
      .avatar-glasses::after {
        position: absolute;
        border: 1.6px solid #157994;
        border-radius: 3px;
      }

      .avatar-glasses {
        top: 10px;
        left: 7px;
        width: 8px;
        height: 6px;
        background: rgba(255, 255, 255, 0.18);
      }

      .avatar-glasses::before,
      .avatar-glasses::after {
        top: -1.6px;
        width: 8px;
        height: 6px;
        content: "";
      }

      .avatar-glasses::before {
        left: 10px;
      }

      .avatar-glasses::after {
        left: 4px;
        width: 2px;
        height: 1px;
        border: none;
        border-top: 1.6px solid #157994;
        border-radius: 0;
        background: transparent;
      }

      .avatar-body {
        position: absolute;
        bottom: 2px;
        left: 6px;
        width: 22px;
        height: 12px;
        border-radius: 12px 12px 8px 8px;
        background: linear-gradient(180deg, #24c58c 0%, #11a66d 100%);
      }

      .operator-name {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .operator-role {
        margin: 4px 0 0;
        color: var(--accent);
        font-size: 13px;
      }

      .binding-card {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        padding: 13px 14px 11px;
        border-radius: 14px;
        border: 1px solid rgba(189, 234, 220, 0.96);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.36) 0%, rgba(227, 247, 239, 0.82) 100%);
      }

      .binding-card span {
        color: var(--muted);
        font-size: 12px;
      }

      .binding-card strong {
        display: block;
        margin-top: 3px;
        color: var(--accent);
        font-size: 16px;
        font-weight: 700;
      }

      .binding-card .arrow {
        color: var(--accent);
        font-size: 24px;
        line-height: 1;
      }

      .filter-card {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        margin-top: 18px;
        padding: 15px 16px;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: var(--shadow);
      }

      .filter-divider {
        width: 1px;
        height: 20px;
        background: #e6ecf2;
      }

      .filter-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: #5d6570;
        font-size: 14px;
      }

      .filter-button--active {
        color: var(--accent);
        font-weight: 700;
      }

      .icon-caret {
        position: relative;
        width: 10px;
        height: 6px;
        color: currentColor;
      }

      .icon-caret::before {
        position: absolute;
        top: 1px;
        left: 0;
        width: 0;
        height: 0;
        border-right: 5px solid transparent;
        border-left: 5px solid transparent;
        border-top: 6px solid currentColor;
        content: "";
      }

      .search-row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .search-box {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 10px;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: var(--shadow);
      }

      .search-box input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: #5d6570;
        font-size: 14px;
      }

      .search-box input::placeholder {
        color: #b0b8c4;
      }

      .icon-search {
        position: relative;
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        color: #7b8da3;
      }

      .icon-search::before {
        position: absolute;
        top: 0;
        left: 0;
        width: 12px;
        height: 12px;
        border: 2px solid currentColor;
        border-radius: 50%;
        content: "";
      }

      .icon-search::after {
        position: absolute;
        right: 0;
        bottom: 2px;
        width: 8px;
        height: 2px;
        border-radius: 999px;
        background: currentColor;
        transform: rotate(45deg);
        transform-origin: right center;
        content: "";
      }

      .search-button,
      .sheet-confirm,
      .sheet-cancel {
        min-width: 72px;
        padding: 0 18px;
        border-radius: 22px;
        font-size: 15px;
        font-weight: 700;
      }

      .search-button {
        color: #ffffff;
        background: linear-gradient(135deg, #4fcc89 0%, #24a766 100%);
        box-shadow: 0 10px 18px rgba(36, 167, 102, 0.24);
      }

      .status-filters {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        margin-top: 16px;
      }

      .status-chip {
        min-width: 0;
        padding: 0 8px;
        height: 30px;
        border: 1px solid #d9e2eb;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #697482;
        font-size: 13px;
        white-space: nowrap;
      }

      .status-chip.is-active {
        border-color: var(--accent);
        background: #f4fbf7;
        color: var(--accent);
        box-shadow: 0 8px 18px rgba(24, 172, 103, 0.12);
      }

      .order-list,
      .doctor-list {
        display: grid;
        gap: 14px;
        margin-top: 14px;
      }

      .order-card,
      .doctor-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(228, 235, 242, 0.96);
        border-radius: 14px;
        background: #ffffff;
        box-shadow: var(--shadow);
      }

      .order-state,
      .doctor-badge {
        position: absolute;
        top: 0;
        right: 0;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 10px 6px 9px;
        border-radius: 0 14px 0 12px;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
      }

      .order-state::before,
      .doctor-badge::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        content: "";
      }

      .order-state--reported,
      .doctor-badge--enabled {
        background: linear-gradient(135deg, #21c77a 0%, #0aa567 100%);
      }

      .order-state--paid {
        background: linear-gradient(135deg, #ff9b45 0%, #ff7f23 100%);
      }

      .order-state--checked {
        background: linear-gradient(135deg, #6cc8d6 0%, #46afbf 100%);
      }

      .order-state--interpreted {
        background: linear-gradient(135deg, #7d9ec5 0%, #6988b2 100%);
      }

      .doctor-badge--disabled {
        background: linear-gradient(135deg, #a8b4c4 0%, #909bad 100%);
      }

      .doctor-badge--pending {
        background: linear-gradient(135deg, #f59a27 0%, #eb7f02 100%);
      }

      .order-code {
        padding: 17px 18px 15px;
        border-bottom: 1px solid #edf2f6;
        color: #8c95a1;
        font-size: 13px;
        letter-spacing: 0.01em;
      }

      .order-body {
        display: grid;
        gap: 13px;
        padding: 15px 18px 0;
      }

      .meta-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
      }

      .meta-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        color: #5f6771;
        font-size: 13px;
        line-height: 1.2;
        white-space: nowrap;
      }

      .meta-item span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .meta-icon,
      .line-icon {
        position: relative;
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        color: #12a767;
      }

      .meta-icon--user::before {
        position: absolute;
        top: 1px;
        left: 4px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .meta-icon--user::after {
        position: absolute;
        bottom: 1px;
        left: 2px;
        width: 10px;
        height: 5px;
        border-radius: 5px 5px 2px 2px;
        background: currentColor;
        content: "";
      }

      .meta-icon--phone {
        width: 10px;
        height: 14px;
        border: 1.8px solid currentColor;
        border-radius: 2px;
      }

      .meta-icon--phone::before {
        position: absolute;
        right: 2px;
        bottom: 2px;
        left: 2px;
        height: 1.6px;
        border-radius: 999px;
        background: currentColor;
        content: "";
      }

      .meta-icon--time {
        border: 1.8px solid currentColor;
        border-radius: 50%;
      }

      .meta-icon--time::before {
        position: absolute;
        top: 2px;
        left: 6px;
        width: 1.8px;
        height: 5px;
        border-radius: 999px;
        background: currentColor;
        content: "";
      }

      .meta-icon--time::after {
        position: absolute;
        top: 7px;
        left: 6px;
        width: 4px;
        height: 1.8px;
        border-radius: 999px;
        background: currentColor;
        transform: rotate(35deg);
        transform-origin: left center;
        content: "";
      }

      .meta-icon--money {
        border-radius: 50%;
        background: currentColor;
      }

      .meta-icon--money::after {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #ffffff;
        font-size: 9px;
        font-weight: 700;
        content: "¥";
      }

      .line-icon {
        color: #9ea4ab;
      }

      .line-icon::before {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .line-icon::after {
        position: absolute;
        top: 5px;
        left: 6px;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: #ffffff;
        content: "";
      }

      .order-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 14px 18px 16px;
        padding: 12px 14px;
        border-radius: 10px;
        background: linear-gradient(180deg, #eff9f4 0%, #e5f5ee 100%);
      }

      .order-footer span {
        color: #66717a;
        font-size: 14px;
      }

      .order-footer strong {
        color: #38404a;
      }

      .detail-button {
        color: var(--accent);
        font-size: 15px;
        font-weight: 700;
      }

      .doctor-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .section-title-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-mark {
        width: 4px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
      }

      .section-title-group h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .scan-bind-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent);
        color: #ffffff;
        font-size: 13px;
      }

      .icon-qr {
        position: relative;
        width: 14px;
        height: 14px;
        border: 1.6px solid currentColor;
        border-radius: 3px;
      }

      .icon-qr::before {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 3px;
        height: 3px;
        background: currentColor;
        box-shadow: 7px 0 0 currentColor, 0 7px 0 currentColor;
        content: "";
      }

      .icon-qr::after {
        position: absolute;
        right: 2px;
        bottom: 2px;
        width: 4px;
        height: 4px;
        border: 1.6px solid currentColor;
        content: "";
      }

      .search-row--doctor {
        margin-top: 14px;
      }

      .doctor-card-head {
        min-height: 78px;
        padding: 16px 16px 10px;
      }

      .doctor-name {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .doctor-phone {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        color: var(--accent);
        font-size: 14px;
      }

      .doctor-card-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: linear-gradient(180deg, #f6fcf8 0%, #eff8f4 100%);
      }

      .doctor-time {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #929aa6;
        font-size: 13px;
      }

      .doctor-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 56px;
        padding: 5px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
      }

      .doctor-action--stop {
        background: #fff1eb;
        color: #ff7d4a;
      }

      .doctor-action--enable {
        background: #e6f8f1;
        color: var(--accent);
      }

      .empty-state {
        display: none;
        margin-top: 14px;
        padding: 28px 16px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.82);
        color: #8d97a4;
        font-size: 14px;
        text-align: center;
        box-shadow: var(--shadow);
      }

      .empty-state.is-visible {
        display: block;
      }

      .overlay-backdrop {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: rgba(34, 40, 48, 0.32);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease;
      }

      .overlay-backdrop.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .bottom-sheet,
      .confirm-dialog {
        position: absolute;
        z-index: 21;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.24s ease, transform 0.24s ease;
      }

      .bottom-sheet {
        right: 0;
        bottom: 0;
        left: 0;
        padding-bottom: 16px;
        border-radius: 24px 24px 0 0;
        background: #ffffff;
        box-shadow: 0 -10px 32px rgba(32, 42, 54, 0.16);
        transform: translateY(100%);
      }

      .bottom-sheet.is-active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .sheet-header {
        display: grid;
        grid-template-columns: 40px 1fr 40px;
        align-items: center;
        padding: 18px 16px 16px;
        border-bottom: 1px solid #eff3f7;
      }

      .sheet-header h3 {
        margin: 0;
        text-align: center;
        font-size: 16px;
        font-weight: 700;
      }

      .time-picker {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
        padding: 20px 16px 18px;
      }

      .picker-column {
        display: grid;
        gap: 22px;
        justify-items: center;
      }

      .picker-option {
        color: #d0d5dd;
        font-size: 14px;
      }

      .picker-option.is-selected {
        color: var(--accent);
        font-size: 18px;
        font-weight: 700;
      }

      .doctor-option-list {
        padding: 0 16px 12px;
      }

      .doctor-option {
        display: block;
        width: 100%;
        padding: 18px 0;
        border-bottom: 1px solid #eff3f7;
        color: #5f6771;
        font-size: 15px;
        text-align: left;
      }

      .doctor-option.is-selected {
        color: var(--accent);
        font-weight: 700;
      }

      .sheet-footer {
        display: flex;
        gap: 16px;
        padding: 10px 16px 4px;
      }

      .sheet-cancel,
      .sheet-confirm {
        flex: 1;
        height: 46px;
      }

      .sheet-cancel {
        border: 1px solid var(--accent);
        color: var(--accent);
        background: #ffffff;
      }

      .sheet-confirm {
        color: #ffffff;
        background: linear-gradient(135deg, #69d79a 0%, #22a465 100%);
      }

      .confirm-dialog {
        top: 244px;
        right: 28px;
        left: 28px;
        overflow: hidden;
        border-radius: 10px;
        background: #ffffff;
        box-shadow: 0 16px 32px rgba(40, 49, 58, 0.18);
        transform: translateY(12px);
      }

      .confirm-dialog.is-active {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .dialog-head {
        padding: 20px 16px 10px;
        text-align: center;
        font-size: 15px;
        font-weight: 700;
      }

      .dialog-body {
        padding: 12px 18px 28px;
        text-align: center;
        color: #4b525c;
        font-size: 15px;
      }

      .dialog-actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        border-top: 1px solid #eceff4;
      }

      .dialog-actions button {
        height: 62px;
        font-size: 16px;
      }

      .dialog-actions button + button {
        border-left: 1px solid #eceff4;
      }

      .dialog-confirm {
        color: var(--accent);
        font-weight: 700;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        z-index: 30;
        transform: translateX(-50%) translateY(12px);
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(48, 57, 66, 0.92);
        color: #ffffff;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .toast.is-visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 420px) {
        body {
          padding: 0;
          background: #ffffff;
        }

        .prototype-shell {
          width: 100%;
        }

        .phone-canvas {
          height: 100vh;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="prototype-shell" aria-label="运营端二级页高保真原型">
      <section class="phone-canvas">
        <div class="status-bar">
          <div class="status-side">
            <span class="signal-dots">●●●●●</span>
            <span class="status-label">WeChat</span>
          </div>
          <span class="status-time">1:21 AM</span>
          <div class="status-side status-side--right">
            <span class="status-label">100%</span>
            <span class="battery" aria-hidden="true"><i></i></span>
          </div>
        </div>

        <div class="page-stack">
          <section class="page page--main is-active" data-view="main">
            <header class="brand-header">
              <button class="close-button" type="button" data-action="close-prototype" aria-label="关闭"></button>
              <h1>一脉青藤</h1>
              <span aria-hidden="true"></span>
            </header>

            <nav class="primary-tabs" aria-label="一级导航">
              <button type="button">检查检验</button>
              <button type="button" class="is-active">我的管理</button>
            </nav>

            <div class="main-screen">
              <div class="screen-pattern" aria-hidden="true"></div>

              <section class="management-card" aria-label="运营概览">
                <div class="operator-profile">
                  <div class="operator-avatar" aria-hidden="true">
                    <div class="avatar-figure">
                      <span class="avatar-hair"></span>
                      <span class="avatar-face"></span>
                      <span class="avatar-glasses"></span>
                      <span class="avatar-body"></span>
                    </div>
                  </div>
                  <div>
                    <p class="operator-name">刘大福</p>
                    <p class="operator-role">运营人员</p>
                  </div>
                </div>

                <button class="binding-card" type="button" data-action="open-doctors">
                  <div>
                    <span>绑定医生</span>
                    <strong>8人</strong>
                  </div>
                  <span class="arrow" aria-hidden="true">›</span>
                </button>
              </section>

              <section class="filter-card" aria-label="时间与所属医生筛选">
                <button class="filter-button filter-button--active" id="monthTrigger" type="button" data-action="open-month-sheet">
                  <span id="monthLabel">2026年5月</span>
                  <span class="icon-caret" aria-hidden="true"></span>
                </button>
                <span class="filter-divider" aria-hidden="true"></span>
                <button class="filter-button" id="doctorTrigger" type="button" data-action="open-doctor-sheet">
                  <span id="doctorLabel">所属医生</span>
                  <span class="icon-caret" aria-hidden="true"></span>
                </button>
              </section>

              <section class="search-row" aria-label="订单搜索">
                <label class="search-box">
                  <span class="icon-search" aria-hidden="true"></span>
                  <input id="orderSearchInput" type="search" placeholder="请输入姓名/手机号" />
                </label>
                <button class="search-button" id="orderSearchButton" type="button">搜索</button>
              </section>

              <div class="status-filters" id="statusFilters" role="tablist" aria-label="订单状态筛选">
                <button class="status-chip is-active" type="button" data-filter="all">全部</button>
                <button class="status-chip" type="button" data-filter="paid">已支付</button>
                <button class="status-chip" type="button" data-filter="checked">已检查</button>
                <button class="status-chip" type="button" data-filter="reported">已出报告</button>
                <button class="status-chip" type="button" data-filter="interpreted">已解读</button>
              </div>

              <section class="order-list" id="orderList" aria-label="订单列表"></section>
              <div class="empty-state" id="orderEmpty">未找到匹配的订单，可调整筛选条件后再试。</div>
            </div>
          </section>

          <section class="page page--doctor" data-view="doctors">
            <header class="secondary-header">
              <button class="nav-back" type="button" data-action="back-main" aria-label="返回"></button>
              <h1>我的医生</h1>
              <span aria-hidden="true"></span>
            </header>

            <div class="doctor-screen">
              <section class="doctor-section-head" aria-label="我的医生头部">
                <div class="section-title-group">
                  <span class="section-mark" aria-hidden="true"></span>
                  <h2>我的医生</h2>
                </div>
                <button class="scan-bind-button" type="button" data-action="scan-bind">
                  <span class="icon-qr" aria-hidden="true"></span>
                  <span>扫码绑定</span>
                </button>
              </section>

              <section class="search-row search-row--doctor" aria-label="医生搜索">
                <label class="search-box">
                  <span class="icon-search" aria-hidden="true"></span>
                  <input id="doctorSearchInput" type="search" placeholder="请输入姓名/手机号" />
                </label>
                <button class="search-button" id="doctorSearchButton" type="button">搜索</button>
              </section>

              <section class="doctor-list" id="doctorList" aria-label="医生列表"></section>
              <div class="empty-state" id="doctorEmpty">未找到匹配的医生账号。</div>
            </div>
          </section>
        </div>

        <button class="overlay-backdrop" id="overlayBackdrop" type="button" data-action="close-overlay" aria-label="关闭弹层"></button>

        <section class="bottom-sheet" id="monthSheet" aria-label="时间选择">
          <div class="sheet-header">
            <span aria-hidden="true"></span>
            <h3>时间选择</h3>
            <button class="sheet-close" type="button" data-action="close-overlay" aria-label="关闭"></button>
          </div>
          <div class="time-picker">
            <div class="picker-column" id="yearOptions"></div>
            <div class="picker-column" id="monthOptions"></div>
          </div>
          <div class="sheet-footer">
            <button class="sheet-cancel" type="button" data-action="close-overlay">取消</button>
            <button class="sheet-confirm" type="button" data-action="confirm-month-sheet">确定</button>
          </div>
        </section>

        <section class="bottom-sheet" id="doctorSheet" aria-label="所属医生选择">
          <div class="sheet-header">
            <span aria-hidden="true"></span>
            <h3>所属医生</h3>
            <button class="sheet-close" type="button" data-action="close-overlay" aria-label="关闭"></button>
          </div>
          <div class="doctor-option-list" id="doctorOptions"></div>
          <div class="sheet-footer">
            <button class="sheet-cancel" type="button" data-action="close-overlay">取消</button>
            <button class="sheet-confirm" type="button" data-action="confirm-doctor-sheet">确定</button>
          </div>
        </section>

        <section class="confirm-dialog" id="stopDialog" aria-label="停用确认">
          <div class="dialog-head">提示</div>
          <div class="dialog-body">是否要停用当前医生账号</div>
          <div class="dialog-actions">
            <button type="button" data-action="close-overlay">取消</button>
            <button class="dialog-confirm" type="button" data-action="confirm-stop-doctor">确定</button>
          </div>
        </section>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const orderSeed = [
        {
          id: "order-1",
          code: "QT88888888888888",
          patient: "刘大福",
          age: 58,
          phone: "134****0750",
          time: "2026-06-18 12:12:12",
          amount: "¥180",
          doctor: "张明医生",
          doctorDisplay: "张医生",
          status: "reported",
        },
        {
          id: "order-2",
          code: "QT88888888888888",
          patient: "刘大福",
          age: 58,
          phone: "134****0750",
          time: "2026-06-18 12:12:12",
          amount: "¥180",
          doctor: "张明医生",
          doctorDisplay: "张医生",
          status: "paid",
        },
        {
          id: "order-3",
          code: "QT66666666666666",
          patient: "王阿姨",
          age: 46,
          phone: "136****0216",
          time: "2026-05-20 09:18:33",
          amount: "¥260",
          doctor: "王丽医生",
          doctorDisplay: "王丽医生",
          status: "checked",
        },
        {
          id: "order-4",
          code: "QT55555555555555",
          patient: "李先生",
          age: 52,
          phone: "138****7712",
          time: "2026-05-10 18:20:16",
          amount: "¥320",
          doctor: "李涛医生",
          doctorDisplay: "李涛医生",
          status: "interpreted",
        },
      ];

      const doctorSheetOptions = [
        { id: "doctor-option-1", label: "张明医生" },
        { id: "doctor-option-2", label: "王丽医生" },
        { id: "doctor-option-3", label: "李涛医生" },
        { id: "doctor-option-4", label: "张明医生" },
        { id: "doctor-option-5", label: "王丽医生" },
        { id: "doctor-option-6", label: "李涛医生" },
      ];

      const statusMeta = {
        paid: { label: "已支付", className: "order-state--paid" },
        checked: { label: "已检查", className: "order-state--checked" },
        reported: { label: "已出报告", className: "order-state--reported" },
        interpreted: { label: "已解读", className: "order-state--interpreted" },
      };

      const doctorStatusMeta = {
        enabled: {
          label: "启用中",
          className: "doctor-badge--enabled",
          timeLabel: "启用时间：",
          action: (doctorId) => `<button class="doctor-action doctor-action--stop" type="button" data-stop-id="${doctorId}">停用</button>`,
        },
        disabled: {
          label: "已停用",
          className: "doctor-badge--disabled",
          timeLabel: "停用时间：",
          action: (doctorId) => `<button class="doctor-action doctor-action--enable" type="button" data-enable-id="${doctorId}">启用</button>`,
        },
        pending: {
          label: "审核中",
          className: "doctor-badge--pending",
          timeLabel: "申请时间：",
          action: () => "",
        },
      };

      const years = ["2023", "2024", "2025", "2026", "2027"];
      const months = ["2", "3", "4", "5", "6"];

      const state = {
        view: "main",
        overlay: null,
        activeStatus: "all",
        orderKeyword: "",
        doctorKeyword: "",
        appliedTimeLabel: "2026年5月",
        appliedDoctorLabel: "所属医生",
        selectedDoctorFilter: "",
        sheetYear: "2025",
        sheetMonth: "4",
        sheetDoctorOptionId: "doctor-option-4",
        pendingDoctorId: null,
        doctors: [
          { id: "doctor-1", name: "张明医生", phone: "134****0750", status: "enabled", timestamp: "2026-05-10 12:10:16" },
          { id: "doctor-2", name: "张明医生", phone: "134****0750", status: "disabled", timestamp: "2026-05-10 12:10:16" },
          { id: "doctor-3", name: "张明医生", phone: "134****0750", status: "pending", timestamp: "2026-05-10 12:10:16" },
        ],
      };

      const orderList = document.querySelector("#orderList");
      const orderEmpty = document.querySelector("#orderEmpty");
      const doctorList = document.querySelector("#doctorList");
      const doctorEmpty = document.querySelector("#doctorEmpty");
      const monthLabel = document.querySelector("#monthLabel");
      const doctorLabel = document.querySelector("#doctorLabel");
      const doctorTrigger = document.querySelector("#doctorTrigger");
      const orderSearchInput = document.querySelector("#orderSearchInput");
      const doctorSearchInput = document.querySelector("#doctorSearchInput");
      const yearOptions = document.querySelector("#yearOptions");
      const monthOptions = document.querySelector("#monthOptions");
      const doctorOptions = document.querySelector("#doctorOptions");
      const toast = document.querySelector("#toast");
      const backdrop = document.querySelector("#overlayBackdrop");
      const monthSheet = document.querySelector("#monthSheet");
      const doctorSheet = document.querySelector("#doctorSheet");
      const stopDialog = document.querySelector("#stopDialog");
      const pages = Array.from(document.querySelectorAll(".page"));
      const statusFilters = Array.from(document.querySelectorAll("[data-filter]"));

      let toastTimer = null;

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          toast.classList.remove("is-visible");
        }, 1600);
      }

      function getSheetDoctorLabel() {
        const current = doctorSheetOptions.find((item) => item.id === state.sheetDoctorOptionId);
        return current ? current.label : "张明医生";
      }

      function setView(view) {
        state.view = view;
        pages.forEach((page) => {
          page.classList.toggle("is-active", page.dataset.view === view);
        });
      }

      function syncOverlay() {
        const hasOverlay = Boolean(state.overlay);
        backdrop.classList.toggle("is-visible", hasOverlay);
        monthSheet.classList.toggle("is-active", state.overlay === "month");
        doctorSheet.classList.toggle("is-active", state.overlay === "doctor");
        stopDialog.classList.toggle("is-active", state.overlay === "stop");
      }

      function closeOverlay() {
        state.overlay = null;
        state.pendingDoctorId = null;
        syncOverlay();
      }

      function renderFilterLabels() {
        monthLabel.textContent = state.appliedTimeLabel;
        doctorLabel.textContent = state.appliedDoctorLabel;
        doctorTrigger.classList.toggle("filter-button--active", state.appliedDoctorLabel !== "所属医生");
      }

      function renderStatusFilters() {
        statusFilters.forEach((chip) => {
          chip.classList.toggle("is-active", chip.dataset.filter === state.activeStatus);
        });
      }

      function renderOrders() {
        const keyword = state.orderKeyword.trim().toLowerCase();
        const filtered = orderSeed.filter((order) => {
          const matchesStatus = state.activeStatus === "all" || order.status === state.activeStatus;
          const matchesDoctor = !state.selectedDoctorFilter || order.doctor === state.selectedDoctorFilter;
          const haystack = [order.code, order.patient, order.phone, order.doctor, order.doctorDisplay].join(" ").toLowerCase();
          const matchesKeyword = !keyword || haystack.includes(keyword);
          return matchesStatus && matchesDoctor && matchesKeyword;
        });

        orderList.innerHTML = filtered
          .map((order) => {
            const meta = statusMeta[order.status];
            return `
              <article class="order-card">
                <span class="order-state ${meta.className}">${meta.label}</span>
                <div class="order-code">${order.code}</div>
                <div class="order-body">
                  <div class="meta-row">
                    <div class="meta-item">
                      <span class="meta-icon meta-icon--user" aria-hidden="true"></span>
                      <span>${order.patient} ｜ ${order.age}岁</span>
                    </div>
                    <div class="meta-item">
                      <span class="meta-icon meta-icon--phone" aria-hidden="true"></span>
                      <span>${order.phone}</span>
                    </div>
                  </div>
                  <div class="meta-row">
                    <div class="meta-item">
                      <span class="meta-icon meta-icon--time" aria-hidden="true"></span>
                      <span>${order.time}</span>
                    </div>
                    <div class="meta-item">
                      <span class="meta-icon meta-icon--money" aria-hidden="true"></span>
                      <span>${order.amount}</span>
                    </div>
                  </div>
                </div>
                <div class="order-footer">
                  <span>关联医生：<strong>${order.doctorDisplay}</strong></span>
                  <button class="detail-button" type="button" data-action="open-order-detail">订单详情 &gt;</button>
                </div>
              </article>
            `;
          })
          .join("");

        orderEmpty.classList.toggle("is-visible", filtered.length === 0);
      }

      function renderDoctorCards() {
        const keyword = state.doctorKeyword.trim().toLowerCase();
        const filtered = state.doctors.filter((doctor) => {
          const haystack = [doctor.name, doctor.phone].join(" ").toLowerCase();
          return !keyword || haystack.includes(keyword);
        });

        doctorList.innerHTML = filtered
          .map((doctor) => {
            const meta = doctorStatusMeta[doctor.status];
            return `
              <article class="doctor-card">
                <span class="doctor-badge ${meta.className}">${meta.label}</span>
                <div class="doctor-card-head">
                  <p class="doctor-name">${doctor.name}</p>
                  <div class="doctor-phone">
                    <span class="meta-icon meta-icon--phone" aria-hidden="true"></span>
                    <span>${doctor.phone}</span>
                  </div>
                </div>
                <div class="doctor-card-foot">
                  <span class="doctor-time">
                    <span class="line-icon" aria-hidden="true"></span>
                    <span>${meta.timeLabel}${doctor.timestamp}</span>
                  </span>
                  ${meta.action(doctor.id)}
                </div>
              </article>
            `;
          })
          .join("");

        doctorEmpty.classList.toggle("is-visible", filtered.length === 0);
      }

      function renderTimeSheet() {
        yearOptions.innerHTML = years
          .map((year) => `<button class="picker-option ${state.sheetYear === year ? "is-selected" : ""}" type="button" data-year="${year}">${year}年</button>`)
          .join("");

        monthOptions.innerHTML = months
          .map((month) => `<button class="picker-option ${state.sheetMonth === month ? "is-selected" : ""}" type="button" data-month="${month}">${month}月</button>`)
          .join("");
      }

      function renderDoctorSheet() {
        doctorOptions.innerHTML = doctorSheetOptions
          .map(
            (item) => `
              <button class="doctor-option ${state.sheetDoctorOptionId === item.id ? "is-selected" : ""}" type="button" data-doctor-option="${item.id}">
                ${item.label}
              </button>
            `,
          )
          .join("");
      }

      function renderAll() {
        renderFilterLabels();
        renderStatusFilters();
        renderOrders();
        renderDoctorCards();
        renderTimeSheet();
        renderDoctorSheet();
        syncOverlay();
        setView(state.view);
      }

      document.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;

        const { action, filter, year, month, doctorOption, stopId, enableId } = button.dataset;

        if (filter) {
          state.activeStatus = filter;
          renderStatusFilters();
          renderOrders();
          return;
        }

        if (year) {
          state.sheetYear = year;
          renderTimeSheet();
          return;
        }

        if (month) {
          state.sheetMonth = month;
          renderTimeSheet();
          return;
        }

        if (doctorOption) {
          state.sheetDoctorOptionId = doctorOption;
          renderDoctorSheet();
          return;
        }

        if (stopId) {
          state.pendingDoctorId = stopId;
          state.overlay = "stop";
          syncOverlay();
          return;
        }

        if (enableId) {
          const target = state.doctors.find((doctor) => doctor.id === enableId);
          if (target) {
            target.status = "enabled";
            showToast("已启用医生账号");
            renderDoctorCards();
          }
          return;
        }

        switch (action) {
          case "close-prototype":
            showToast("当前为静态原型演示页");
            break;
          case "open-doctors":
            setView("doctors");
            break;
          case "back-main":
            setView("main");
            break;
          case "open-month-sheet":
            state.overlay = "month";
            syncOverlay();
            break;
          case "open-doctor-sheet":
            state.overlay = "doctor";
            syncOverlay();
            break;
          case "close-overlay":
            closeOverlay();
            break;
          case "confirm-month-sheet":
            state.appliedTimeLabel = `${state.sheetYear}年${state.sheetMonth}月`;
            closeOverlay();
            renderFilterLabels();
            showToast("已切换时间筛选");
            break;
          case "confirm-doctor-sheet":
            state.appliedDoctorLabel = getSheetDoctorLabel();
            state.selectedDoctorFilter = state.appliedDoctorLabel;
            closeOverlay();
            renderFilterLabels();
            renderOrders();
            showToast(`已切换到${state.appliedDoctorLabel}`);
            break;
          case "confirm-stop-doctor": {
            const target = state.doctors.find((doctor) => doctor.id === state.pendingDoctorId);
            if (target) {
              target.status = "disabled";
            }
            closeOverlay();
            renderDoctorCards();
            showToast("已停用当前医生账号");
            break;
          }
          case "scan-bind":
            showToast("已打开扫码绑定入口");
            break;
          case "open-order-detail":
            window.location.href = "04-订单详情.html";
            break;
          default:
            break;
        }
      });

      document.querySelector("#orderSearchButton").addEventListener("click", () => {
        state.orderKeyword = orderSearchInput.value;
        renderOrders();
      });

      document.querySelector("#doctorSearchButton").addEventListener("click", () => {
        state.doctorKeyword = doctorSearchInput.value;
        renderDoctorCards();
      });

      orderSearchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          state.orderKeyword = orderSearchInput.value;
          renderOrders();
        }
      });

      doctorSearchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          state.doctorKeyword = doctorSearchInput.value;
          renderDoctorCards();
        }
      });

      renderAll();
    </script>
  </body>
</html>
